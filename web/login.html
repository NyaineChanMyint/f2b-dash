<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Fail2Ban Dashboard</title>
  <link rel="stylesheet" href="css/theme.css">
  <style>
    body { min-height:100vh; margin:0; display:grid; place-items:center; font-family:var(--font-sans,system-ui); background:var(--bg-primary); color:var(--text-primary); }
    main { width:min(100% - 2rem, 25rem); padding:2rem; border:1px solid var(--border); border-radius:12px; background:var(--bg-card); box-shadow:0 1rem 3rem #0003; }
    h1 { margin-top:0; } label { display:block; margin:1rem 0 .35rem; } input { box-sizing:border-box; width:100%; padding:.75rem; border:1px solid var(--border); border-radius:6px; background:var(--bg-input); color:var(--text-primary); } button { width:100%; margin-top:1.25rem; padding:.75rem; border:0; border-radius:6px; background:var(--accent); color:var(--text-inverse); font-weight:700; cursor:pointer; } #error { min-height:1.25rem; color:#ef4444; margin-top:1rem; }
  </style>
</head>
<body>
  <main>
    <h1>🛡️ Fail2Ban Dashboard</h1>
    <p>Sign in to view centralized security events.</p>
    <form id="login-form">
      <label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button><p id="error" role="alert"></p>
    </form>
  <script>
    document.getElementById('login-form').addEventListener('submit', async function (event) {
      event.preventDefault(); const error = document.getElementById('error'); error.textContent = '';
      const response = await fetch('/api/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:username.value, password:password.value})});
      if (response.ok) location.assign('/'); else error.textContent = 'Invalid username or password.';
    });
  </script>
</body>
</html>
